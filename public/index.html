<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>ZOZ Pro — Business OS</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Business OS</div>
        <h1>ZOZ Pro</h1>
      </div>
      <div id="health-badge" class="badge muted">Checking…</div>
    </header>

    <main class="content">
      <section class="view active" data-view="dashboard">
        <div class="section-heading">
          <div>
            <div class="eyebrow">Control Center</div>
            <h2>Dashboard</h2>
          </div>
          <span id="deployment-badge" class="badge">Not deployed</span>
        </div>

        <div class="status-grid" id="project-status"></div>
        <div class="panel">
          <div class="panel-header">
            <h3>Current Task</h3>
            <span id="current-task-status" class="status"></span>
          </div>
          <div id="current-task"></div>
        </div>
        <div class="panel">
          <div class="panel-header">
            <h3>Next Action</h3>
          </div>
          <p id="next-action" class="muted-text"></p>
        </div>
      </section>

      <section class="view" data-view="projects">
        <div class="section-heading"><h2>Projects</h2></div>
        <div class="panel" id="projects-list"></div>
      </section>

      <section class="view" data-view="tasks">
        <div class="section-heading">
          <h2>Tasks</h2>
          <span class="badge">CEO → Agent → Verify</span>
        </div>
        <div id="tasks-list" class="stack"></div>
      </section>

      <section class="view" data-view="approvals">
        <div class="section-heading"><h2>Approvals</h2></div>
        <div id="approvals-list" class="stack"></div>
      </section>

      <section class="view" data-view="activity">
        <div class="section-heading"><h2>Activity Log</h2></div>
        <div id="activity-list" class="stack"></div>
      </section>

      <section class="view" data-view="agents">
        <div class="section-heading"><h2>Agents</h2></div>
        <div id="agents-list" class="stack"></div>
      </section>

      <section class="view" data-view="settings">
        <div class="section-heading"><h2>Settings</h2></div>
        <div class="panel" id="settings-panel"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-nav="dashboard" class="nav-item active">Dashboard</button>
      <button data-nav="projects" class="nav-item">Projects</button>
      <button data-nav="tasks" class="nav-item">Tasks</button>
      <button data-nav="approvals" class="nav-item">Approvals</button>
      <button data-nav="activity" class="nav-item">Activity</button>
      <button data-nav="agents" class="nav-item">Agents</button>
      <button data-nav="settings" class="nav-item">Settings</button>
    </nav>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
