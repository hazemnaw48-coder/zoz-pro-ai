<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="ZOZ Pro — مركز واحد لتحليل القناة ثم رفع الفيديو">
<title>ZOZ Pro — مركز التحليل ورفع الفيديو</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#0b1220;--panel:#122139;--line:#304763;--text:#eef4ff;--muted:#a9bad0;--blue:#3978c3}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:linear-gradient(160deg,#0b1422,#101c2d);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1450px;margin:auto;padding:12px}
header{padding:8px 4px 14px}
.brand{font-size:12px;color:#a9c8f1}
h1{font-size:clamp(23px,5vw,34px);line-height:1.25;margin:3px 0 7px}
header p{margin:0;color:var(--muted);font-size:14px}
nav{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
nav button{font:inherit;font-weight:750;cursor:pointer;color:var(--text);background:#122139;border:1px solid var(--line);border-radius:12px;padding:11px 16px;min-height:46px}
nav button[aria-selected="true"]{background:#19365a;border-color:#5386c5;box-shadow:inset 0 0 0 1px #5386c5}
.frame-wrap{border:1px solid var(--line);background:#0b1220;border-radius:15px;overflow:hidden;min-height:78vh}
iframe{display:block;width:100%;height:1000px;min-height:78vh;border:0;background:#0b1220}
footer{text-align:center;color:#8295ad;font-size:12px;padding:12px 5px 20px}
@media(max-width:520px){.shell{padding:9px}header{padding:5px 2px 10px}nav{display:grid;grid-template-columns:1fr 1fr}nav button{padding:10px 6px;font-size:14px}.frame-wrap{border-radius:11px}}
</style>
</head>
<body>
<main class="shell">
<header>
<div class="brand">ZOZ PRO · مركز العمل الموحد</div>
<h1>مركز التحليل ورفع الفيديو</h1>
<p>ابدأ بتحليل أداء القناة والتوصيات، ثم انتقل إلى رفع الفيديو من داخل المركز نفسه.</p>
</header>
<nav aria-label="خطوات العمل">
<button type="button" id="analysis-tab" aria-selected="true">١ · مركز التحليل</button>
<button type="button" id="upload-tab" aria-selected="false">٢ · رفع الفيديو</button>
</nav>
<section class="frame-wrap" aria-label="مساحة العمل">
<iframe id="workspace" title="مركز التحليل ورفع الفيديو" src="./channel-dashboard.html" loading="eager" referrerpolicy="same-origin"></iframe>
</section>
<footer>قسم واحد: التحليل أولًا، ثم رفع الفيديو. لا حاجة إلى قسم الملفات والنشر القديم.</footer>
</main>
<script>
(function(){
  "use strict";
  const frame=document.getElementById("workspace");
  const analysis=document.getElementById("analysis-tab");
  const upload=document.getElementById("upload-tab");
  let active="";
  function resizeFrame(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      const body=doc.body, root=doc.documentElement;
      const height=Math.max(window.innerHeight*.78,body?body.scrollHeight:0,root?root.scrollHeight:0)+12;
      frame.style.height=Math.ceil(height)+"px";
    }catch(_){}
  }
  function show(which,updateUrl){
    active=which;
    const isUpload=which==="upload";
    analysis.setAttribute("aria-selected",String(!isUpload));
    upload.setAttribute("aria-selected",String(isUpload));
    const next=isUpload?"./channel-control.html":"./channel-dashboard.html";
    if(!frame.src.endsWith(next.replace("./","/zoz-pro-ai/")) && !frame.getAttribute("src").endsWith(next)){
      frame.src=next;
    }
    if(updateUrl){
      const url=new URL(window.location.href);
      if(isUpload)url.searchParams.set("tab","upload");else url.searchParams.delete("tab");
      window.history.replaceState({}, "", url.pathname+(url.search?url.search:"")+url.hash);
    }
    resizeFrame();
  }
  analysis.addEventListener("click",()=>show("analysis",true));
  upload.addEventListener("click",()=>show("upload",true));
  frame.addEventListener("load",()=>{
    resizeFrame();
    try{
      const doc=frame.contentDocument;
      if(doc&&doc.documentElement&&"MutationObserver" in window){
        new MutationObserver(resizeFrame).observe(doc.documentElement,{childList:true,subtree:true,attributes:true});
      }
    }catch(_){}
    setTimeout(resizeFrame,250);
    setTimeout(resizeFrame,1000);
  });
  window.addEventListener("resize",resizeFrame);
  const initial=new URLSearchParams(window.location.search).get("tab")==="upload"?"upload":"analysis";
  show(initial,false);
})();
</script>
</body>
</html>
