<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="robots" content="noindex,nofollow">
<title>ZOZ Pro — المركز المدمج</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0b1220;color:#eef4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#101827;border-bottom:1px solid #2b3c53;flex:0 0 auto}
.logo{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:10px;background:#253b63;font-weight:800}
.heading{min-width:0}.heading strong{display:block;font-size:14px}.heading small{display:block;color:#a9bad0;font-size:11px;margin-top:2px}
.guard{margin-inline-start:auto;font-size:11px;color:#b8c9e4;text-align:left;white-space:nowrap}
.tabs{display:flex;gap:8px;padding:8px 10px;background:#0f1929;border-bottom:1px solid #2b3c53;flex:0 0 auto}
.tabs button{flex:1;min-height:42px;padding:8px 10px;border:1px solid #344660;border-radius:11px;color:#dbe7f7;background:#142237;font:inherit;font-size:13px;font-weight:700}
.tabs button[aria-selected="true"]{background:#29466b;border-color:#75a9e8;color:#fff}
.workspace{display:none;border:0;width:100%;flex:1 1 auto;min-height:0;height:100%;background:#0c1422}
.workspace.active{display:block}
footer{flex:0 0 auto;padding:4px 10px;text-align:center;font-size:10px;color:#8295ad;background:#0b1220}
@media(max-width:560px){.bar{padding:7px 8px}.heading strong{font-size:12px}.heading small{font-size:10px}.guard{max-width:88px;white-space:normal;font-size:10px;line-height:1.3}.tabs{gap:6px;padding:7px}.tabs button{font-size:12px;min-height:44px;padding:7px 5px}}
</style>
</head>
<body>
<header class="bar">
 <span class="logo">Z</span>
 <div class="heading"><strong>ZOZ Pro — المركز المدمج</strong><small>تحليل القناة ← موافقة المالك ← الإنشاء ← الملفات والنشر</small></div>
 <span class="guard">لا نشر تلقائي</span>
</header>
<nav class="tabs" aria-label="أقسام مركز ZOZ Pro">
 <button id="channel-tab" type="button" aria-selected="false">لوحة أداء القنوات</button>
 <button id="production-tab" type="button" aria-selected="false">الإنشاء والمهام والملفات والنشر</button>
</nav>
<iframe id="channel-frame" class="workspace" title="لوحة أداء قنوات ZOZ Pro" loading="eager" allow="clipboard-read; clipboard-write; autoplay"></iframe>
<iframe id="production-frame" class="workspace" title="إنشاء المحتوى والمهام والملفات والنشر" loading="lazy" allow="clipboard-read; clipboard-write; autoplay"></iframe>
<footer>ZOZ Pro · واجهة موحّدة · تُحفظ الملفات للمراجعة ولا يتم النشر العام دون موافقة</footer>
<script>
(function(){
 "use strict";
 const query=new URLSearchParams(location.search);
 const channelFrame=document.getElementById("channel-frame");
 const productionFrame=document.getElementById("production-frame");
 const channelTab=document.getElementById("channel-tab");
 const productionTab=document.getElementById("production-tab");
 const channelUrl="./channel-dashboard.html";
 const productionParams=new URLSearchParams({embedded:"1",tab:"jobs"});
 if(query.has("handoff")) productionParams.set("handoff","1");
 if(query.has("task")) productionParams.set("task",query.get("task"));
 if(query.has("job")) productionParams.set("task",query.get("job"));
 const productionUrl="./production-center.html?"+productionParams.toString();
 channelFrame.src=channelUrl;
 let productionLoaded=false;
 function activate(which,writeUrl){
  const isProduction=which==="production";
  channelTab.setAttribute("aria-selected",String(!isProduction));
  productionTab.setAttribute("aria-selected",String(isProduction));
  channelFrame.classList.toggle("active",!isProduction);
  productionFrame.classList.toggle("active",isProduction);
  if(isProduction&&!productionLoaded){productionFrame.src=productionUrl;productionLoaded=true;}
  if(writeUrl){
   const next=new URL(location.href);
   next.searchParams.delete("handoff");next.searchParams.delete("task");next.searchParams.delete("job");
   next.searchParams.set("tab",isProduction?"jobs":"channel");
   history.replaceState(null,"",next.pathname+next.search+next.hash);
  }
 }
 channelTab.addEventListener("click",()=>activate("channel",true));
 productionTab.addEventListener("click",()=>activate("production",true));
 const openProduction=query.has("handoff")||query.has("task")||query.has("job")||query.get("tab")==="jobs"||query.get("tab")==="production";
 activate(openProduction?"production":"channel",false);
 window.addEventListener("message",event=>{
  if(event.origin!==location.origin||!event.data||event.data.type!=="zoz-show-production")return;
  activate("production",true);
 });
})();
</script>
</body>
</html>
