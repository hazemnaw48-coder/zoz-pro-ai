<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="robots" content="noindex,nofollow">
<title>ZOZ Pro — مركز تحليل وإنتاج موحّد</title>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  if (q.has("handoff") || q.has("task") || q.get("tab") === "jobs") {
    location.replace("./production-center.html" + location.search + location.hash);
  }
})();
</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b1220;color:#eef4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}.bar{display:flex;align-items:center;gap:10px;padding:9px 13px;background:#101827;border-bottom:1px solid #2b3c53;flex:0 0 auto}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#253b63;font-weight:800}.heading{min-width:0}.heading strong{display:block;font-size:14px}.heading small{display:block;color:#a9bad0;font-size:11px;margin-top:2px}
.hint{margin-inline-start:auto;font-size:11px;color:#b8c9e4;text-align:left}.workspace{border:0;width:100%;flex:1 1 auto;min-height:0;height:calc(100dvh - 54px);background:#0c1422}
@media(max-width:560px){.bar{padding:7px 9px}.hint{max-width:118px;line-height:1.35}}
</style>
</head>
<body>
<header class="bar"><span class="logo">Z</span><div class="heading"><strong>ZOZ Pro — مركز تحليل وإنتاج موحّد</strong><small>تحليل القناة ← اعتماد التوصية ← إنتاج الفيديو ومراجعته</small></div><span class="hint">لا نشر تلقائي</span></header>
<iframe class="workspace" name="zoz-workspace" title="مركز تحليل القناة والإنتاج" src="./channel-control.html?integrated=1" allow="clipboard-read; clipboard-write; autoplay"></iframe>
</body>
</html>
