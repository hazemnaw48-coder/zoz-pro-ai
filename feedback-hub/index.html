<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>Feedback Hub | مركز الملاحظات</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1220;color:#f3f6fc}
*{box-sizing:border-box}body{margin:0;padding:24px 14px;min-height:100vh;background:radial-gradient(ellipse at top,#1b3152 0,#0b1220 55%)}
main{max-width:620px;margin:0 auto}.brand{display:flex;align-items:center;gap:12px;margin:8px 0 22px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#3979ef;font-weight:800;font-size:23px}.brand small,.muted{color:#aebbd0}
.card{background:#131e30;border:1px solid #2b3b53;border-radius:22px;padding:22px;box-shadow:0 18px 50px #0003}h1{font-size:27px;margin:0 0 8px}p{line-height:1.7}.muted{font-size:14px}
label{display:block;font-weight:650;margin:16px 0 7px}input,select,textarea{width:100%;margin-top:7px;background:#0b1424;color:#f3f6fc;border:1px solid #354861;border-radius:12px;padding:13px;font:inherit}textarea{min-height:140px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stars{display:flex;gap:8px;direction:ltr;margin-top:8px}.stars button{background:#0b1424;border:1px solid #354861;color:#f6c85f;border-radius:10px;font-size:25px;padding:5px 10px;cursor:pointer}.stars button[aria-pressed=true]{background:#35415a}
.submit{width:100%;margin-top:22px;border:0;border-radius:13px;padding:14px;background:#3979ef;color:white;font-weight:750;font-size:16px;cursor:pointer}.submit:disabled{opacity:.6}.status{padding:12px;border-radius:12px;margin-top:14px;display:none;line-height:1.6}.status.show{display:block}.success{background:#123b30;color:#9ef0cd}.error{background:#4a222a;color:#ffd0d5}footer{text-align:center;color:#93a4bc;font-size:12px;padding:20px}
@media(max-width:480px){.row{grid-template-columns:1fr}.card{padding:18px}body{padding:16px 12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><main>
<header class="brand"><div class="logo">F</div><div><strong>Feedback Hub</strong><br><small>مركز الملاحظات والاقتراحات</small></div></header>
<section class="card"><h1>رأيك يساعدنا على التحسين</h1><p class="muted">أرسل اقتراحًا أو بلّغ عن مشكلة. تُحفظ الرسالة في قاعدة البيانات بأمان، ولا يمكن للزوار قراءة ردود الآخرين.</p>
<form id="feedback-form">
<div class="row"><div><label for="name">الاسم (اختياري)</label><input id="name" maxlength="100" autocomplete="name" placeholder="اسمك"></div><div><label for="email">البريد الإلكتروني (اختياري)</label><input id="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com"></div></div>
<label for="category">نوع الملاحظة</label><select id="category" required><option value="suggestion">اقتراح</option><option value="bug">الإبلاغ عن مشكلة</option><option value="experience">تجربتي</option><option value="other">أخرى</option></select>
<label>تقييمك (اختياري)</label><div class="stars" role="group" aria-label="التقييم من واحد إلى خمسة"><button type="button" data-rating="1" aria-pressed="false" aria-label="نجمة واحدة">★</button><button type="button" data-rating="2" aria-pressed="false" aria-label="نجمتان">★</button><button type="button" data-rating="3" aria-pressed="false" aria-label="ثلاث نجوم">★</button><button type="button" data-rating="4" aria-pressed="false" aria-label="أربع نجوم">★</button><button type="button" data-rating="5" aria-pressed="false" aria-label="خمس نجوم">★</button></div>
<label for="message">رسالتك</label><textarea id="message" required minlength="10" maxlength="3000" placeholder="اكتب ملاحظتك هنا (10 أحرف على الأقل)"></textarea>
<button class="submit" id="submit" type="submit">إرسال الملاحظة</button><div id="status" class="status" role="status" aria-live="polite"></div>
</form></section><footer>Feedback Hub · نموذج مستقل · قاعدة بيانات Supabase</footer>
</main>
<script>
const SUPABASE_URL="https://vjnwojrqduoxhetutxrs.supabase.co";
const SUPABASE_KEY="sb_publishable_h0eas8ulCa_7zdrt3OvFGA_6aeAuxSw";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let rating=null;
document.querySelectorAll("[data-rating]").forEach(btn=>btn.addEventListener("click",()=>{rating=Number(btn.dataset.rating);document.querySelectorAll("[data-rating]").forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.rating)<=rating)))}));
const form=document.getElementById("feedback-form"),submit=document.getElementById("submit"),status=document.getElementById("status");
function show(text,kind){status.textContent=text;status.className="status show "+kind}
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;submit.textContent="جارٍ حفظ الملاحظة…";status.className="status";
const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),message=document.getElementById("message").value.trim(),category=document.getElementById("category").value;
try{const {error}=await client.from("feedback_hub_responses").insert({name:name||null,email:email||null,category,rating,message});if(error)throw error;show("تم حفظ ملاحظتك بنجاح. شكرًا لمشاركتك!","success");form.reset();rating=null;document.querySelectorAll("[data-rating]").forEach(b=>b.setAttribute("aria-pressed","false"))}
catch(err){show("لم نتمكن من حفظ الملاحظة. تحقق من الاتصال وحاول مرة أخرى. "+(err?.code==="42P01"?"جدول البيانات غير جاهز بعد.":""),"error");console.error("Feedback submission failed",err)}
finally{submit.disabled=false;submit.textContent="إرسال الملاحظة"}});
</script></body></html>
