<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>ZOZ Software Factory</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#142238;--line:#30445e;--text:#edf4ff;--muted:#a9bad0;--blue:#4b83d6;--green:#287b5d;--red:#853f4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,Tahoma,sans-serif}header{padding:18px max(18px,calc((100% - 1180px)/2));background:#111d30;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}main{max-width:1180px;margin:22px auto;padding:0 14px}.panel,.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric strong{display:block;font-size:25px}.muted,small{color:var(--muted)}input,textarea,select{width:100%;padding:11px;margin:5px 0 12px;border-radius:8px;border:1px solid var(--line);background:#0b1728;color:var(--text);font:inherit}button{border:0;border-radius:9px;background:var(--blue);color:white;padding:10px 15px;margin:3px;cursor:pointer;font:inherit}button.alt{background:#30445e}button:disabled{opacity:.5}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.card{background:#0e1a2c;border:1px solid var(--line);border-radius:12px;padding:14px}.tag{display:inline-block;padding:3px 9px;border:1px solid var(--line);border-radius:30px;font-size:12px}.msg{padding:10px;border-radius:8px;background:#1a3049;margin:10px 0}.bad{background:#512631}.good{background:#164332}.hidden{display:none!important}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid var(--line);font-size:13px}.scroll{overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}a{color:#9bc6ff}@media(max-width:600px){header{align-items:flex-start}main{padding:0 10px}}
</style></head><body>
<header><div><b>ZOZ Software Factory</b><div class="muted">محرك دورة حياة المنتجات البرمجية</div></div><div><span id="session" class="tag">غير متصل</span> <button id="logout" class="alt hidden">خروج</button></div></header>
<main>
<section id="login" class="panel"><h2>دخول مالك المصنع</h2><p class="muted">استخدم حساب مالك ZOZ Pro المؤكد. لا تُدخل مفاتيح سرية هنا.</p><label>البريد</label><input id="email" type="email" autocomplete="username" value="hazemnaw48@gmail.com"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button id="signin">دخول</button><p id="loginmsg" class="msg">اتصال Supabase Preview</p></section>
<section id="app" class="hidden"><div class="grid" id="metrics"></div>
<div class="panel"><div class="actions"><h2 style="margin-inline-end:auto">محفظة المنتجات</h2><button id="refresh" class="alt">تحديث</button></div><div id="products" class="grid"></div></div>
<div class="panel"><h2>تسجيل منتج جديد</h2><div class="row"><div><label>اسم المنتج</label><input id="pname" placeholder="اسم تجاري"></div><div><label>معرّف URL (بالإنجليزية)</label><input id="pslug" placeholder="product-name"></div><div><label>المرحلة</label><select id="pstage"><option value="discovery">اكتشاف</option><option value="specification">المواصفات</option><option value="building">التطوير</option><option value="testing">الاختبار</option><option value="staging">نسخة تجريبية</option><option value="pilot">تجربة عميل</option></select></div></div><label>وصف المنتج والعميل المستهدف</label><textarea id="pdesc" rows="2"></textarea><button id="addproduct">إنشاء سجل المنتج</button></div>
<div class="panel"><h2>تفاصيل المنتج المحدد</h2><div id="detail" class="muted">اختر منتجًا لعرض بوابات الجودة والمهام والدفتر المالي.</div></div>
<div class="panel"><h2>آخر أنشطة المصنع</h2><div id="runs" class="scroll"></div></div>
</section></main>
<script>
(function(){
const URL="https://vjnwojrqduoxhetutxrs.supabase.co",KEY="sb_publishable_h0eas8ulCa_7zdrt3OvFGA_6aeAuxSw";
const db=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let user=null,products=[],selected=null,runs=[],gates=[],ledger=[];
const stages={discovery:"اكتشاف",specification:"مواصفات",building:"تطوير",testing:"اختبار",staging:"تجريبي",pilot:"تجربة عميل",production:"إنتاج",paused:"متوقف",archived:"مؤرشف"};
function say(id,msg,kind){$(id).textContent=msg;$(id).className="msg "+(kind||"")}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function show(on){$("login").classList.toggle("hidden",on);$("app").classList.toggle("hidden",!on);$("logout").classList.toggle("hidden",!on);$("session").textContent=on?"مالك موثّق":"غير متصل"}
async function rows(table,query){const {data,error}=await query;if(error)throw error;return data||[]}
async function load(){products=await rows("products",db.from("zoz_software_products").select("*").order("updated_at",{ascending:false}));runs=await rows("runs",db.from("zoz_software_runs").select("*").order("created_at",{ascending:false}).limit(30));render()}
function render(){
$("metrics").innerHTML=[["المنتجات",products.length],["قيد التطوير",products.filter(p=>["building","testing","staging"].includes(p.stage)).length],["تجربة عميل",products.filter(p=>p.stage==="pilot").length],["إنتاج",products.filter(p=>p.stage==="production").length]].map(x=>'<div class="metric">'+x[0]+'<strong>'+x[1]+'</strong></div>').join("");
$("products").innerHTML=products.map(p=>'<article class="card"><div class="actions"><b>'+safe(p.name)+'</b><span class="tag">'+(stages[p.stage]||safe(p.stage))+'</span></div><p class="muted">'+safe(p.description)+'</p><small>'+safe(p.slug)+'</small><div class="actions"><button data-open="'+p.id+'">فتح لوحة المنتج</button>'+(p.repository_url?'<a href="'+safe(p.repository_url)+'" target="_blank" rel="noreferrer">المستودع ↗</a>':'')+'</div></article>').join("")||'<p class="muted">لا توجد منتجات مسجلة بعد.</p>';
$("runs").innerHTML='<table><thead><tr><th>المنتج</th><th>النوع</th><th>الحالة</th><th>الملخص</th><th>الدليل</th></tr></thead><tbody>'+runs.map(r=>'<tr><td>'+safe((products.find(p=>p.id===r.product_id)||{}).name||"—")+'</td><td>'+safe(r.run_type)+'</td><td>'+safe(r.status)+'</td><td>'+safe(r.summary)+'</td><td>'+(r.evidence_url?'<a href="'+safe(r.evidence_url)+'" target="_blank">فتح</a>':'—')+'</td></tr>').join("")+'</tbody></table>';
}
async function openProduct(id){selected=products.find(p=>p.id===id);if(!selected)return;const [g,l]=await Promise.all([rows("gates",db.from("zoz_software_quality_gates").select("*").eq("product_id",id).order("gate_key")),rows("ledger",db.from("zoz_software_ledger").select("*").eq("product_id",id).order("occurred_on",{ascending:false}).limit(20))]);gates=g;ledger=l;
$("detail").innerHTML='<h3>'+safe(selected.name)+'</h3><p>'+safe(selected.description)+'</p><button id="runbuild">إنشاء فرع تطوير وبناء هيكل التطبيق</button><p class="muted">يستخدم المستودع المسجل أدناه إن كان موجودًا، وينشئ فرعًا معزولًا وملفات المشروع داخله دون تعديل الفرع الرئيسي. يلزم GitHub token بصلاحية Contents: write على المستودع. اترك رابط المستودع فارغًا فقط إذا أردت إنشاء مستودع جديد وكان التوكن يملك صلاحية إنشاء المستودعات.</p><div class="row"><div><label>المستودع</label><input id="repo" value="'+safe(selected.repository_url||"")+'" placeholder="https://github.com/owner/repo"></div><div><label>فرع التطوير</label><input id="branch" value="'+safe(selected.repository_branch||"")+'"></div><div><label>مرجع Supabase Preview</label><input id="preview" value="'+safe(selected.preview_project_ref||"")+'"></div><div><label>رابط نسخة المعاينة</label><input id="appurl" value="'+safe(selected.app_url||"")+'"></div></div><button id="savemeta">حفظ روابط التنفيذ</button><h4>بوابات الجودة</h4><div class="grid">'+gates.map(x=>'<div class="card"><b>'+safe(x.gate_key)+'</b><p class="tag">'+safe(x.status)+'</p><label>الدليل / رابط الاختبار</label><input id="gate-evidence-'+safe(x.id)+'" maxlength="1200" placeholder="اكتب نتيجة التحقق أو رابط الدليل"><div class="actions"><button data-gate="'+x.id+'" data-status="passed">اجتياز بالدليل</button><button class="alt" data-gate="'+x.id+'" data-status="failed">تسجيل فشل</button></div></div>').join("")+'</div><h4>تسجيل تشغيل أو اختبار</h4><div class="row"><select id="rtype"><option value="spec">مواصفات</option><option value="build">بناء</option><option value="test">اختبار</option><option value="security_review">مراجعة أمن</option><option value="deploy">نشر تجريبي</option><option value="incident">حادث</option><option value="release">إصدار</option></select><select id="rstatus"><option value="planned">مخطط</option><option value="running">جارٍ</option><option value="passed">ناجح</option><option value="failed">فشل</option><option value="blocked">محظور</option></select><input id="rsummary" placeholder="نتيجة التنفيذ والدليل"></div><button id="addr">حفظ سجل التشغيل</button><h4>دفتر التكلفة والإيراد</h4><div class="row"><select id="ltype"><option value="cost">تكلفة</option><option value="revenue">إيراد</option><option value="refund">استرداد</option><option value="asset">أصل</option></select><input id="lamount" type="number" min="0" step=".01" placeholder="المبلغ"><select id="lcurrency"><option>EGP</option><option>USD</option><option>EUR</option></select><input id="lcat" placeholder="التصنيف"></div><button id="addledger">تسجيل الحركة</button><div class="scroll"><table><thead><tr><th>النوع</th><th>المبلغ</th><th>التصنيف</th><th>التاريخ</th></tr></thead><tbody>'+ledger.map(x=>'<tr><td>'+safe(x.entry_type)+'</td><td>'+safe(x.amount)+' '+safe(x.currency)+'</td><td>'+safe(x.category)+'</td><td>'+safe(x.occurred_on)+'</td></tr>').join("")+'</tbody></table></div>';
$("runbuild").onclick=async()=>{const b=$("runbuild");b.disabled=true;b.textContent="جارٍ إنشاء المشروع...";const {data,error}=await db.functions.invoke("zoz-factory-build",{body:{product_id:id,repository_url:$("repo").value.trim()||null,base_branch:$("branch").value.trim()||null}});b.disabled=false;b.textContent="إنشاء فرع تطوير وبناء هيكل التطبيق";if(error)return alert("تعذر تشغيل المصنع: "+error.message);if(data?.error)return alert(data.error+(data.required_secret?"\nالمتغير المطلوب: "+data.required_secret:""));alert("تم إنشاء مساحة التطوير: "+data.workspace_url+"\nالفرع: "+data.branch);await load();await openProduct(id)};
$("savemeta").onclick=async()=>{const {error}=await db.from("zoz_software_products").update({repository_url:$("repo").value||null,repository_branch:$("branch").value||null,preview_project_ref:$("preview").value||null,app_url:$("appurl").value||null,updated_at:new Date().toISOString()}).eq("id",id);if(error)return alert(error.message);await load();await openProduct(id)};
$("addr").onclick=async()=>{const {error}=await db.from("zoz_software_runs").insert({owner_id:user.id,product_id:id,run_type:$("rtype").value,status:$("rstatus").value,summary:$("rsummary").value.trim()||"تحديث حالة"});if(error)return alert(error.message);await load();await openProduct(id)};
$("addledger").onclick=async()=>{const amount=Number($("lamount").value);if(!(amount>=0))return alert("أدخل مبلغًا صحيحًا");const {error}=await db.from("zoz_software_ledger").insert({owner_id:user.id,product_id:id,entry_type:$("ltype").value,amount,currency:$("lcurrency").value,category:$("lcat").value.trim()||"عام"});if(error)return alert(error.message);await openProduct(id)};
$("detail").querySelectorAll("[data-gate]").forEach(b=>b.onclick=async()=>{const evidence=$("gate-evidence-"+b.dataset.gate).value.trim();if(!evidence)return alert("لا يمكن تغيير حالة بوابة الجودة دون تسجيل دليل أو نتيجة تحقق.");const {error}=await db.from("zoz_software_quality_gates").update({status:b.dataset.status,evidence:evidence,reviewed_at:new Date().toISOString()}).eq("id",b.dataset.gate);if(error)return alert(error.message);await openProduct(id)});
}
$("signin").onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return say("loginmsg",error.message,"bad");const {data:u}=await db.auth.getUser();user=u.user;if((user.email||"").toLowerCase()!=="hazemnaw48@gmail.com"||!user.email_confirmed_at){await db.auth.signOut();return say("loginmsg","يلزم حساب المالك المؤكد.","bad")}show(true);try{await load()}catch(e){say("loginmsg",e.message,"bad")}};
$("logout").onclick=async()=>{await db.auth.signOut();user=null;show(false)};
$("refresh").onclick=()=>load().catch(e=>alert(e.message));
$("addproduct").onclick=async()=>{const name=$("pname").value.trim(),slug=$("pslug").value.trim(),description=$("pdesc").value.trim();if(name.length<2||!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug))return alert("تحقق من الاسم والمعرّف الإنجليزي");const {data,error}=await db.from("zoz_software_products").insert({owner_id:user.id,name,slug,description,stage:$("pstage").value}).select().single();if(error)return alert(error.message);const keys=["requirements","security","tests","tenant_isolation","backup_restore","staging_acceptance","owner_approval"];const {error:ge}=await db.from("zoz_software_quality_gates").insert(keys.map(gate_key=>({owner_id:user.id,product_id:data.id,gate_key})));if(ge)return alert("تم إنشاء المنتج لكن تعذر تجهيز بوابات الجودة: "+ge.message);$("pname").value=$("pslug").value=$("pdesc").value="";await load();await openProduct(data.id)};
$("products").onclick=e=>{const b=e.target.closest("[data-open]");if(b)openProduct(b.dataset.open).catch(x=>alert(x.message))};
(async()=>{const {data:{session}}=await db.auth.getSession();if(session){const {data}=await db.auth.getUser();if(data.user?.email?.toLowerCase()==="hazemnaw48@gmail.com"&&data.user.email_confirmed_at){user=data.user;show(true);try{await load()}catch(e){say("loginmsg",e.message,"bad")}}else await db.auth.signOut()}})();
})();
</script></body></html>
