name: Validate product guide

on:
  pull_request:
    branches: ["main"]
    paths:
      - "product-guide/**"
      - "scripts/validate_product_guide.py"
      - ".github/workflows/validate-product-guide.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Arabic guide pages
        run: python3 scripts/validate_product_guide.py
