name: ZOZ Pro CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify Windows launcher scripts
        shell: pwsh
        run: |
          $install = Get-Content scripts/install-codex-executor-task.ps1 -Raw
          $start = Get-Content scripts/start-codex-executor.ps1 -Raw
          $tailnet = Get-Content scripts/start-zoz-pro-tailnet.ps1 -Raw
          [scriptblock]::Create($install) | Out-Null
          [scriptblock]::Create($start) | Out-Null
          [scriptblock]::Create($tailnet) | Out-Null
          if ($install -notmatch 'param\(') { throw 'Installer parameter declaration missing' }
          if ($tailnet -notmatch 'tailscale serve --bg 3000') { throw 'Tailnet launcher missing Tailscale Serve command' }
