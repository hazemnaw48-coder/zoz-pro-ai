name: ZOZ Pro CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - name: Verify Windows launcher scripts
        shell: pwsh
        run: |
          $install = Get-Content scripts/install-codex-executor-task.ps1 -Raw
          $start = Get-Content scripts/start-codex-executor.ps1 -Raw
          $tailnet = Get-Content scripts/start-zoz-pro-tailnet.ps1 -Raw
          [scriptblock]::Create($install) | Out-Null
          [scriptblock]::Create($start) | Out-Null
          [scriptblock]::Create($tailnet) | Out-Null
          if ($install -notmatch 'param\(') { throw 'Installer parameter declaration missing' }
          if ($tailnet -notmatch 'tailscale serve --bg 3000') { throw 'Tailnet launcher missing Tailscale Serve command' }
      - name: Probe live Preview API (diagnostic, no secrets)
        shell: bash
        continue-on-error: true
        run: |
          set -u
          url="https://zoz-pro-ai-git-feature-zp-012-vercel-cl-42791b-hazemnaw48-coder.vercel.app/api/health"
          code="$(curl -sS --max-time 20 -o /tmp/zoz-health-response.txt -w '%{http_code}' "$url" 2>/tmp/zoz-health-curl-error.txt || true)"
          echo "Preview health HTTP status: ${code:-no-response}"
          if [ -s /tmp/zoz-health-curl-error.txt ]; then cat /tmp/zoz-health-curl-error.txt; fi
          if [ -s /tmp/zoz-health-response.txt ]; then head -c 1500 /tmp/zoz-health-response.txt; fi
          {
            echo "## Live Preview API diagnostic"
            echo "- URL: /api/health"
            echo "- HTTP status: ${code:-no-response}"
            if [ -s /tmp/zoz-health-curl-error.txt ]; then echo "- Transport error:"; sed 's/^/  /' /tmp/zoz-health-curl-error.txt; fi
            if [ -s /tmp/zoz-health-response.txt ]; then echo "- Response body (first 1500 bytes):"; echo '~~~'; head -c 1500 /tmp/zoz-health-response.txt; echo; echo '~~~'; fi
          } >> "$GITHUB_STEP_SUMMARY"
