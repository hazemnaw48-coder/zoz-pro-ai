name: ZOZ Pro CI

on:
  push:
  pull_request:

jobs:

  android-flow-bridge:
    name: Build and test Android Flow Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests, lint, and assemble
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - name: Verify Windows launcher scripts
        shell: pwsh
        run: |
          $install = Get-Content scripts/install-codex-executor-task.ps1 -Raw
          $start = Get-Content scripts/start-codex-executor.ps1 -Raw
          $tailnet = Get-Content scripts/start-zoz-pro-tailnet.ps1 -Raw
          [scriptblock]::Create($install) | Out-Null
          [scriptblock]::Create($start) | Out-Null
          [scriptblock]::Create($tailnet) | Out-Null
          if ($install -notmatch 'param\(') { throw 'Installer parameter declaration missing' }
          if ($tailnet -notmatch 'tailscale serve --bg 3000') { throw 'Tailnet launcher missing Tailscale Serve command' }
