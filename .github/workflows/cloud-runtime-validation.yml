name: ZOZ Pro Cloud Runtime Validation

on:
  push:
    branches:
      - feature/ZP-014-vercel-media-intake
      - feature/ZP-015-gemini-cloud-agent
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "src/**"
      - "public/**"
      - "test/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/cloud-runtime-validation.yml"

permissions:
  contents: read

concurrency:
  group: zoz-pro-cloud-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies without saving lockfile changes
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Syntax/build validation
        run: npm run build

      - name: Unit and integration tests
        run: npm test
