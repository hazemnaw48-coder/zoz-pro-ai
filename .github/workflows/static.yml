# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows this workflow to be started manually
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site files
        run: |
          mkdir -p _site
          cp analysis-production.html agent-control.html agent-control-preview.html index.html production-center.html production-workbench.html production-workbench.js channel-control.html youtube-analytics.html youtube-manager.html studio.html proof-studio.html studio.css studio.js visual-production.js production-handoff.js pwa.js sw.js manifest.webmanifest zoz-icon.svg channel-dashboard.html dashboard.html android-app-factory.html terms-of-service.html privacy-policy.html tiktok1ShjJDl7tDu6DbqXFuOmpvDQgPYBqPcZ.txt _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/studio.html
          echo "Verified Pages entrypoints:" && ls -l _site/index.html _site/studio.html
          mkdir -p _site/production
          cp studio/index.html studio/style.css _site/production/
          git fetch origin supabase-studio-pages
          git show origin/supabase-studio-pages:studio/app.js > _site/production/app.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
