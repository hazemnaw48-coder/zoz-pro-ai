# Deploy ZOZ Pro static site and independent product apps to GitHub Pages
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
    paths:
      - "software-factory.html"
      - "dashboard.html"
      - "_site/fieldops/**"
      - "fieldops/**"
      - ".github/workflows/static.yml"
      - "analysis-production.html"
      - "channel-control.html"
      - "company-office.html"
      - "qwen-provider-connect.html"
      - "video-provider-connect.html"
      - "studio/**"
      - "studio.html"
      - "production/**"
      - "production-center.html"
      - "production-workbench.html"
      - "production-workbench.js"
      - "agent-control.html"
      - "agent-control-preview.html"
      - "index.html"
      - "intelligence.html"
      - "customer-portal.html"
      - "youtube-analytics.html"
      - "youtube-manager.html"
      - "proof-studio.html"
      - "studio.css"
      - "studio.js"
      - "visual-production.js"
      - "production-handoff.js"
      - "pwa.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "zoz-icon.svg"
      - "channel-dashboard.html"
      - "android-app-factory.html"
      - "app-control.html"
      - "tool-credentials.html"
      - "whatsapp-center.html"
      - "terms-of-service.html"
      - "privacy-policy.html"
      - "canva-connect.html"
      - "canva-connect-v2.html"
      - "tiktok1ShjJDl7tDu6DbqXFuOmpvDQgPYBqPcZ.txt"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          mkdir -p _site/fieldops
          cp -a fieldops/. _site/fieldops/
          cp whatsapp-center.html analysis-production.html agent-control.html agent-control-preview.html index.html production-center.html production-workbench.html production-workbench.js channel-control.html company-office.html qwen-provider-connect.html video-provider-connect.html youtube-analytics.html youtube-manager.html studio.html proof-studio.html studio.css studio.js visual-production.js production-handoff.js pwa.js sw.js manifest.webmanifest zoz-icon.svg channel-dashboard.html dashboard.html android-app-factory.html app-control.html tool-credentials.html terms-of-service.html privacy-policy.html canva-connect.html canva-connect-v2.html tiktok1ShjJDl7tDu6DbqXFuOmpvDQgPYBqPcZ.txt software-factory.html customer-portal.html _site/
          test -s _site/whatsapp-center.html
          test -s _site/intelligence.html
          grep -q "ZOZ Intelligence" _site/intelligence.html
          test -s _site/customer-portal.html
          grep -q "بوابة الشركات" _site/customer-portal.html
          node -e "const fs=require('fs');const h=fs.readFileSync('_site/customer-portal.html','utf8');const scripts=[...h.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];if(!scripts.length)throw Error('Customer portal script missing');fs.writeFileSync('/tmp/customer-portal-inline.js',scripts[scripts.length-1][1]);"
          node --check /tmp/customer-portal-inline.js
          node -e "const fs=require('fs');const h=fs.readFileSync('_site/whatsapp-center.html','utf8');if(!h.includes('oxyzxbkwhafzaztraowc.supabase.co')||!h.includes('sb_publishable_')||h.includes('sb_publishable_preview')||!h.includes('zoz-whatsapp-control'))throw Error('WhatsApp center configuration missing or not production');const scripts=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];if(!scripts.length)throw Error('WhatsApp center script missing');fs.writeFileSync('/tmp/whatsapp-center-inline.js',scripts[scripts.length-1][1]);"
          node --check /tmp/whatsapp-center-inline.js
          test -s _site/software-factory.html
          test -s _site/dashboard.html
          test -s _site/fieldops/index.html
          test -s _site/fieldops/config.js
          test -s _site/fieldops/manifest.webmanifest
          node -e "JSON.parse(require('fs').readFileSync('_site/fieldops/manifest.webmanifest','utf8'))"
          node -e "const fs=require('fs');const c=fs.readFileSync('_site/fieldops/config.js','utf8');if(!c.includes('https://oxyzxbkwhafzaztraowc.supabase.co')||!c.includes('sb_publishable_')||c.includes('YOUR_')||/service_role|sb_secret_/i.test(c))throw Error('FieldOps Supabase config is missing, placeholder, or unsafe');const h=fs.readFileSync('_site/fieldops/index.html','utf8');for(const id of ['signup','signin','createCompany','addCustomer','addTech','addOrder','addFin','addQuote','quoteOrder','exportBackup','exportOrders','refresh'])if(!h.includes('id=\\\"'+id+'\\\"'))throw Error('Missing FieldOps control: '+id);if(!h.includes('data-print-quote'))throw Error('Quote print workflow missing');if(!h.includes('fieldops-')||!h.includes('ZOZ-FieldOps-Company-Export'))throw Error('Company export format missing');const scripts=[...h.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];if(!scripts.length)throw Error('FieldOps inline application script missing');fs.writeFileSync('/tmp/fieldops-inline.js',scripts[scripts.length-1][1]);const sw=fs.readFileSync('_site/fieldops/sw.js','utf8');if(!sw.includes('fieldops-v6'))throw Error('Expected FieldOps cache version missing');"
          node --check /tmp/fieldops-inline.js
          touch _site/.nojekyll
          mkdir -p _site/production
          cp studio/index.html studio/style.css _site/production/
          cp studio/app.js _site/production/app.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Wait for Pages artifact metadata propagation
        run: sleep 15
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live FieldOps deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 10 --retry-all-errors "${base}/fieldops/" -o /tmp/fieldops-live.html
          grep -q "ZOZ FieldOps" /tmp/fieldops-live.html
          curl --fail --silent --show-error "${base}/fieldops/config.js" -o /tmp/fieldops-live-config.js
          grep -q "oxyzxbkwhafzaztraowc.supabase.co" /tmp/fieldops-live-config.js
          grep -q "sb_publishable_" /tmp/fieldops-live-config.js
          ! grep -Eiq "service_role|sb_secret_" /tmp/fieldops-live-config.js
          echo "FieldOps live Pages route and public Supabase config verified."
