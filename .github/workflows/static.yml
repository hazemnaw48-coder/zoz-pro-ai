# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping jobs queued between runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site files
        run: |
          mkdir -p _site
          cp index.html studio.html studio.css studio.js pwa.js sw.js manifest.webmanifest zoz-icon.svg terms-of-service.html privacy-policy.html tiktok1ShjJDl7tDu6DbqXFuOmpvDQgPYBqPcZ.txt _site/
          mkdir -p _site/production
          cp studio/index.html studio/style.css _site/production/
          git fetch origin supabase-studio-pages
          git show origin/supabase-studio-pages:studio/app.js > _site/production/app.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
