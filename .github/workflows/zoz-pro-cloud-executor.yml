name: ZOZ Pro Cloud Executor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: zoz-pro-cloud-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTROL_URL: ${{ secrets.ZOZ_PRO_CONTROL_URL }}
      CONTROL_TOKEN: ${{ secrets.ZOZ_CONTROL_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CONTROL_URL}" || { echo "::error::Missing ZOZ_PRO_CONTROL_URL"; exit 1; }
          test -n "${CONTROL_TOKEN}" || { echo "::error::Missing ZOZ_CONTROL_TOKEN"; exit 1; }
          if [ -z "${CODEX_ACCESS_TOKEN}" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::Missing CODEX_ACCESS_TOKEN or OPENAI_API_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.158.0

      - name: Authenticate Codex
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CODEX_ACCESS_TOKEN}" ]; then
            printf '%s' "${CODEX_ACCESS_TOKEN}" | codex login --with-access-token
          else
            printf '%s' "${OPENAI_API_KEY}" | codex login --with-api-key
          fi
          codex login status

      - name: Execute one queued task
        shell: bash
        run: |
          set -euo pipefail

          state_json="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${CONTROL_TOKEN}"             "${CONTROL_URL%/}/api/state")"

          command_json="$(printf '%s' "${state_json}" | node --input-type=module -e '
            let s="";
            process.stdin.on("data",c=>s+=c);
            process.stdin.on("end",()=>{
              const state=JSON.parse(s);
              const command=(state.controlCommands||[]).find(c=>c.status==="queued"&&!c.requiresApproval);
              process.stdout.write(command?JSON.stringify(command):"");
            });
          ')"

          if [ -z "${command_json}" ]; then
            echo "No queued cloud command."
            exit 0
          fi

          command_id="$(printf '%s' "${command_json}" | node --input-type=module -e '
            let s="";
            process.stdin.on("data",c=>s+=c);
            process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).id));
          ')"

          task_id="$(printf '%s' "${command_json}" | node --input-type=module -e '
            let s="";
            process.stdin.on("data",c=>s+=c);
            process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).taskId||""));
          ')"

          instruction="$(printf '%s' "${command_json}" | node --input-type=module -e '
            let s="";
            process.stdin.on("data",c=>s+=c);
            process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).instruction));
          ')"

          task_branch="$(printf '%s' "${state_json}" | TASK_ID="${task_id}" node --input-type=module -e '
            let s="";
            process.stdin.on("data",c=>s+=c);
            process.stdin.on("end",()=>{
              const state=JSON.parse(s);
              const task=(state.tasks||[]).find(t=>t.id===process.env.TASK_ID);
              process.stdout.write(task?.branch||"");
            });
          ')"

          test -n "${task_id}" || { echo "::error::Queued command has no taskId"; exit 1; }
          test -n "${task_branch}" || { echo "::error::Task has no branch"; exit 1; }

          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer ${CONTROL_TOKEN}"             -H "Content-Type: application/json"             -d '{"actor":"ZOZ Pro Cloud Executor"}'             "${CONTROL_URL%/}/api/control/commands/${command_id}/claim"

          task_status="$(printf '%s' "${state_json}" | TASK_ID="${task_id}" node --input-type=module -e '
            let s="";
            process.stdin.on("data",c=>s+=c);
            process.stdin.on("end",()=>{
              const state=JSON.parse(s);
              const task=(state.tasks||[]).find(t=>t.id===process.env.TASK_ID);
              process.stdout.write(task?.status||"");
            });
          ')"

          if [ "${task_status}" = "planned" ]; then
            curl --fail-with-body --silent --show-error               -X POST               -H "Authorization: Bearer ${CONTROL_TOKEN}"               -H "Content-Type: application/json"               -d '{"actor":"ZOZ Pro Cloud Executor","status":"assigned"}'               "${CONTROL_URL%/}/api/tasks/${task_id}/transition"
          fi

          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer ${CONTROL_TOKEN}"             -H "Content-Type: application/json"             -d '{"actor":"ZOZ Pro Cloud Executor","status":"executing"}'             "${CONTROL_URL%/}/api/tasks/${task_id}/transition"

          git fetch origin "+refs/heads/*:refs/remotes/origin/*"
          if git show-ref --verify --quiet "refs/remotes/origin/${task_branch}"; then
            git checkout -B "${task_branch}" "origin/${task_branch}"
          else
            git checkout -B "${task_branch}"
          fi

          prompt="$(cat <<EOF
You are the cloud implementation agent for ZOZ Pro.

Execute ONLY this owner task:
${instruction}

Rules:
- Work only in this ZOZ Pro repository and this task branch.
- Never access the legacy ZOZ AI repository.
- Never deploy production.
- Never merge to main.
- Never modify credentials or secrets.
- Never execute financial, external-send, destructive, irreversible, account, or production-affecting actions.
- Do not bypass approval gates.
- Inspect existing code before changing it.
- Run relevant tests/builds.
- Stop and report failure rather than claiming success when verification is not satisfied.
EOF
)"

          codex exec --json --sandbox workspace-write --ask-for-approval never "${prompt}" | tee codex-output.json

          if git diff --quiet && git diff --cached --quiet; then
            commit_sha="$(git rev-parse HEAD)"
          else
            git add -A
            git config user.name "ZOZ Pro Cloud Executor"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ZOZ Pro cloud task ${task_id}"
            git push --set-upstream origin "${task_branch}"
            commit_sha="$(git rev-parse HEAD)"
          fi

          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer ${CONTROL_TOKEN}"             -H "Content-Type: application/json"             -d "{"actor":"ZOZ Pro Cloud Executor","status":"verification","result":"Cloud implementation finished; awaiting verification. commit=${commit_sha}"}"             "${CONTROL_URL%/}/api/tasks/${task_id}/transition"

          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer ${CONTROL_TOKEN}"             -H "Content-Type: application/json"             -d "{"actor":"ZOZ Pro Cloud Executor","result":"Cloud Codex completed on ${task_branch}; commit=${commit_sha}"}"             "${CONTROL_URL%/}/api/control/commands/${command_id}/complete"

          echo "Completed ${command_id}; verification remains required."
