name: ZOZ Pro Free Runtime Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - ".github/workflows/floot-runtime-sweep.yml"

permissions:
  contents: read

concurrency:
  group: zoz-pro-free-runtime-health
  cancel-in-progress: false

jobs:
  health:
    name: Verify published free runtime
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check live app and persistent database health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            "https://zoz-pro-cloud-runtime.floot.app/_api/health")"
          printf '%s' "$response" | python -c '
          import json,sys
          data=json.load(sys.stdin)
          summary={
            "ok": data.get("ok"),
            "runtime": data.get("runtime"),
            "persistent": data.get("persistent"),
            "database": data.get("database"),
            "automation": data.get("automation"),
            "scheduled_jobs_enabled": data.get("scheduled_jobs_enabled")
          }
          print(json.dumps(summary, ensure_ascii=False))
          if data.get("ok") is not True or data.get("persistent") is not True or data.get("database") != "healthy":
              sys.exit(1)
          '
